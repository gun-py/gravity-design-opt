[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwopt"
version = "0.1.0"
description = "Optimizer for gravitational-wave detector design"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "dfbench>=0.3.3",
    "optax>=0.2.0",
    "numpy",
    "jax",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gwopt", "gwopt.*"]
namespaces = false

[tool.setuptools.package-data]
gwopt = ["prior.npz"]

[project.optional-dependencies]
cuda12 = ["dfbench[cuda12]>=0.3.3"]
cuda13 = ["dfbench[cuda13]>=0.3.3"]
qp = ["osqp>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
